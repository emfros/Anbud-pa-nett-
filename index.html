/* Storebrand: varm off-white side, hvite kort med 20px hjørner, pill-knapper, rød som handlingsfarge. Lyst tema, som de andre Storebrand-verktøyene. */
:root {
  color-scheme: light;
  --red-50:#FDF2F1; --red-100:#FBDEDE; --red-200:#F6BFBF; --red-300:#EE9290; --red-500:#ED3024; --red-600:#CC1C23; --red-700:#A20F18; --red-800:#770000; --red-900:#560000;
  --rosa-400:#FFBCD7;
  --n0:#FFFFFF; --n50:#FAF8F7; --n100:#F3EFEE; --n200:#E7E0DE; --n300:#D3C9C6; --n400:#A89D9A; --n500:#7C726F; --n600:#5C5350; --n700:#423B39; --n800:#2A2422; --n900:#1A1514;
  --ok:#1E8A5A; --ok-50:#E6F3EC; --ok-line:#BFE0CD; --ok-ink:#135C3B;
  --warn-50:#FBEFDC; --warn:#7A4A08; --warn-line:#C77A12;
  --on-dark-muted:#E9C9C9;
  --font:'Schibsted Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --f-mono: var(--font);
  --sh: 0 1px 2px rgba(86,0,0,.05), 0 1px 3px rgba(86,0,0,.07);
  --sh-lg: 0 12px 32px rgba(86,0,0,.10), 0 2px 6px rgba(86,0,0,.06);
}

* { box-sizing: border-box }
html { -webkit-text-size-adjust: 100% }
body { background: var(--n50); color: var(--n700); font: 15px/1.5 var(--font) }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--n0) }
h1, h2, h3 { color: var(--n900); font-weight: 700; line-height: 1.2; text-wrap: balance; margin: 0 }
h1 { font-size: 30px; letter-spacing: -.01em } h2 { font-size: 21px } h3 { font-size: 16px }
p { margin: 0 }
.num { font-family: var(--font); font-variant-numeric: tabular-nums }
.mono { font-family: var(--font) }
.muted { color: var(--n500) }
.small { font-size: 13px }
:focus-visible { outline: 2px solid var(--red-500); outline-offset: 2px }

/* toppfelt */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: rgba(255,255,255,.95); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--n200); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.bar-in { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; gap: 10px 16px; min-height: 60px; flex-wrap: wrap; padding-block: 8px }
.logo { display: flex; align-items: center; gap: 16px; min-width: 0 }
.logo img { height: 22px; display: block }
.logo span { padding-left: 16px; border-left: 1px solid var(--n200); font-weight: 700; color: var(--n900); font-size: 15px; white-space: nowrap }
.tag { font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: var(--red-100); color: var(--red-800) }
.bar nav { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; background: var(--n100); padding: 4px; border-radius: 999px }
.bar nav:empty { display: none }
.bar nav button { height: 36px; padding: 0 16px; font-size: 14px; color: var(--n600) }
.bar nav button:hover { background: rgba(255,255,255,.7) }
.bar nav button.on { background: var(--n0); color: var(--red-700); box-shadow: var(--sh) }

main { max-width: 1100px; margin: 0 auto; padding-block: 24px 80px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 16px }

/* kort */
.panel { background: var(--n0); border: 1px solid var(--n200); border-radius: 20px; padding: 28px; display: grid; gap: 18px; min-width: 0; box-shadow: var(--sh) }
.panel.tight { padding: 0; gap: 0; overflow: hidden }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap }
.between { justify-content: space-between }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px 16px }
.stack { display: grid; gap: 10px }

/* skjema */
label.f { display: grid; align-content: start; gap: 6px; font-size: 13px; font-weight: 600; color: var(--n800); min-width: 0 }
input, select, textarea { font: inherit; font-size: 15px; color: var(--n900); background: var(--n0); border: 1px solid var(--n300); border-radius: 12px;
  height: 44px; padding: 0 12px; width: 100%; min-width: 0 }
textarea { height: auto; min-height: 90px; padding: 10px 12px; line-height: 1.5; resize: vertical }
input[type=radio] { height: 20px; width: 20px; accent-color: var(--red-600) }
input::placeholder, textarea::placeholder { color: var(--n400) }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--red-500); box-shadow: 0 0 0 3px rgba(237,48,36,.15) }
input.bad { border-color: var(--red-600); background: var(--red-50) }
input[readonly], textarea[readonly] { background: var(--n100); color: var(--n700) }
.hint { font-size: 12px; color: var(--n500); font-weight: 400 }
.err-t { font-size: 12px; color: var(--red-700); font-weight: 600 }

/* knapper: pill */
button { font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; border-radius: 999px; height: 42px; padding: 0 18px;
  border: 1px solid var(--n300); background: var(--n0); color: var(--red-700); display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap }
button:hover { background: var(--red-50); border-color: var(--red-200) }
button.pri { background: var(--red-600); color: var(--n0); border-color: var(--red-600) }
button.pri:hover { background: var(--red-700); border-color: var(--red-700) }
button.ghost { border-color: transparent; background: transparent; color: var(--n700) }
button.ghost:hover { background: var(--n100) }
button.danger { color: var(--red-700) }
button.link { border: 0; height: auto; padding: 0; background: none; color: var(--red-700); font-weight: 600; border-radius: 0 }
button.link:hover { background: none; text-decoration: underline; text-underline-offset: 3px }
button:disabled { background: var(--n300); border-color: var(--n300); color: var(--n0); cursor: not-allowed }
button.small, .small button { height: 34px; padding: 0 14px; font-size: 13px }

/* status */
.chip { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; white-space: nowrap;
  background: var(--n100); color: var(--n600) }
.chip::first-letter { text-transform: uppercase }
.chip.utsendt { background: var(--ok-50); color: var(--ok-ink) }
.chip.tildelt { background: var(--red-600); color: var(--n0) }
.chip.utkast { background: var(--warn-50); color: var(--warn) }
.chip.avlyst { background: var(--n100); color: var(--n600) }

.box { border-radius: 14px; padding: 14px 16px; font-size: 14px }
.box.err { background: var(--red-50); border: 1px solid var(--red-200); color: var(--red-800) }
.box.err ul { margin: 6px 0 0; padding-left: 20px; display: grid; gap: 3px }
.box.info { background: var(--n100); color: var(--n700) }
.box.warn { background: var(--warn-50); color: var(--warn) }

/* liste */
.list { display: grid }
.item { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; padding: 16px 24px; border: 0; border-top: 1px solid var(--n200); border-radius: 0;
  text-align: left; background: none; color: var(--n700); font-weight: 400; white-space: normal; width: 100%; height: auto; justify-content: stretch }
.item:first-child { border-top: 0 }
.item:hover { background: var(--red-50); border-color: var(--n200) }
.item .t { font-weight: 700; color: var(--n900); display: flex; gap: 10px; align-items: center; flex-wrap: wrap }
.item .r { text-align: right; align-self: center }
.item .r.num { font-weight: 700; color: var(--n900) }

/* tabeller */
.tw { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--n200); border-radius: 14px }
table { border-collapse: collapse; width: 100%; font-size: 14px }
th, td { padding: 10px 12px; border-bottom: 1px solid var(--n200); text-align: left; vertical-align: top }
tbody tr:last-child td { border-bottom: 0 }
th { font-size: 12px; font-weight: 600; color: var(--n500); white-space: nowrap; background: var(--n0) }
td.n, th.n { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums }
td.n:nth-child(3) { font-variant-numeric: normal }
td[colspan] { background: var(--red-50); color: var(--red-800) }
td[colspan] strong { color: var(--red-800) }
tr.sum td { font-weight: 700; color: var(--red-800); border-top: 2px solid var(--red-600) }
td.lo { background: var(--ok-50); color: var(--ok); font-weight: 700 }
.pnr { color: var(--n500); font-size: 13px; white-space: nowrap }

/* bygg og poster (saksbehandler) */
.bygg { border: 1px solid var(--n200); border-radius: 16px; overflow: hidden; display: grid; min-width: 0 }
.bygg .tw { border: 0; border-radius: 0 }
.bygg-h { display: flex; gap: 10px; align-items: center; padding: 8px 12px; background: var(--red-50); flex-wrap: wrap }
.bygg-h .pnr { color: var(--red-600); font-weight: 700; font-size: 15px }
.bygg-h input { max-width: 280px; font-weight: 700; font-size: 16px; border-color: transparent; background: transparent; height: 38px }
.bygg-h input:hover, .bygg-h input:focus { background: var(--n0); border-color: var(--n300) }
.bygg-h h3 { color: var(--n900) }
.post { display: grid; grid-template-columns: 38px 150px minmax(160px,1fr) 90px 84px 120px 110px 36px; gap: 8px; padding: 8px 12px; align-items: center;
  border-bottom: 1px solid var(--n200); min-width: 870px }
.post.head { font-size: 12px; font-weight: 600; color: var(--n500); padding-block: 8px }
.post input, .post select { height: 38px; padding: 0 10px; border-radius: 10px }
.post .ls { text-align: right; font-weight: 600; color: var(--n900) }
.post button.ghost { width: 36px; height: 36px; padding: 0; border-radius: 10px; font-size: 20px; color: var(--n500) }
.post button.ghost:hover { background: var(--red-50); color: var(--red-700) }
.post button.ghost:disabled { background: none; color: var(--n300) }

/* leverandørskjema */
.lev-post { display: grid; grid-template-columns: 1fr auto; gap: 6px 14px; padding: 14px 16px; border-bottom: 1px solid var(--n200); align-items: center }
.lev-post:last-child { border-bottom: 0 }
.lev-post .q { font-size: 13px; color: var(--n500) }
.lev-post .pin { display: flex; align-items: center; gap: 8px }
.lev-post .pin input { width: 140px; text-align: right }
.lev-post .ls { grid-column: 1 / -1; text-align: right; font-size: 14px; font-weight: 600; color: var(--n900); font-variant-numeric: tabular-nums }
.totals { display: grid; gap: 4px; justify-items: end; padding-top: 12px; border-top: 2px solid var(--red-600) }
.totals .big { font-size: 26px; font-weight: 700; color: var(--red-800); font-variant-numeric: tabular-nums }

/* koder */
.code { font-size: 24px; font-weight: 700; letter-spacing: .06em; color: var(--n900); padding: 14px 18px; border: 2px dashed var(--red-300); border-radius: 14px;
  background: var(--red-50); user-select: all; word-break: break-all }
.codein { height: 56px; font-size: 21px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; text-align: center }

/* tilbud */
.cards { display: grid; gap: 10px }
.offer { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 14px; align-items: center; padding: 14px 16px; border: 1px solid var(--n200);
  border-radius: 14px; cursor: pointer; background: var(--n0) }
.offer:hover { border-color: var(--red-200) }

.offer .s { text-align: right; font-weight: 700; color: var(--n900) }
.offer .s .small { font-weight: 600 }
.offer .meta { grid-column: 2 / -1; font-size: 13px; color: var(--n500); display: flex; gap: 12px; flex-wrap: wrap }
.offer .meta.fb { color: var(--warn); background: var(--warn-50); padding: 6px 10px; border-radius: 10px }
.offer .meta.gj { color: var(--n700) }
.offer .meta.gj b { color: var(--n900); font-weight: 600 }

/* steg i skjemaet */
.steg-h { display: grid; gap: 4px }
.step { font-size: 13px; font-weight: 600; color: var(--red-600) }
.sub { font-size: 14px; color: var(--n500); font-weight: 400; max-width: 65ch }
label.f em { font-style: normal; font-weight: 400; color: var(--n500) }
label.f.full, .grid2 .full { grid-column: 1 / -1 }
.krav { display: grid; gap: 6px; padding: 14px 16px; background: var(--n50); border-radius: 14px; font-size: 14px }
.krav strong { color: var(--n800) }
.krav ul, .krav-liste { margin: 0; padding-left: 20px; display: grid; gap: 4px }
.krav-liste { font-size: 15px }

/* anbudet slik leverandøren ser det */
.fakta-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px 20px; padding-top: 16px; border-top: 1px solid var(--n200) }
.fakta { display: grid; gap: 2px; min-width: 0 }
.fakta > span { font-size: 13px; color: var(--n500) }
.fakta b { font-weight: 600; color: var(--n900); overflow-wrap: anywhere }
.omfang { white-space: pre-line; max-width: 70ch }
details.vis-anbud > summary { cursor: pointer; list-style: none; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap }
details.vis-anbud > summary::-webkit-details-marker { display: none }
details.vis-anbud > summary::after { content: "Vis"; margin-left: auto; font-size: 14px; font-weight: 600; color: var(--red-700) }
details.vis-anbud[open] > summary::after { content: "Skjul" }
details.vis-anbud:not([open]) { gap: 0 }
details.vis-anbud .tittel { font-size: 18px }
tr.gj td { color: var(--n600); font-size: 13px; background: var(--n50); font-variant-numeric: normal }

/* leverandørskjema */
.del-h { margin-top: 12px }
.lev-fb { padding: 12px 16px 16px; border-top: 1px solid var(--n200); background: var(--n50) }
.med-enhet { display: flex; align-items: center; gap: 8px }
.med-enhet input { max-width: 160px; text-align: right }
.med-enhet span { font-size: 13px; color: var(--n500); font-weight: 400; white-space: nowrap }
.bekreft { display: flex; gap: 12px; align-items: flex-start; padding: 16px 18px; background: var(--n0); border: 1px solid var(--n200); border-radius: 16px; font-size: 15px; color: var(--n800); cursor: pointer }
.bekreft input { width: 22px; height: 22px; margin: 1px 0 0; flex: none; accent-color: var(--red-600) }

/* spørsmål og svar */
.qa-item { display: grid; gap: 8px; padding: 14px 16px; border: 1px solid var(--n200); border-radius: 14px; background: var(--n0) }
.qa-item.vent { border-color: var(--warn-line); background: var(--warn-50) }
.qa-meta { display: flex; gap: 8px 12px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--n500) }
.qa-q { font-weight: 600; color: var(--n900); white-space: pre-line }
.qa-a { white-space: pre-line; max-width: 70ch }
.qa-item blockquote { margin: 0; padding: 8px 12px; border-left: 3px solid var(--warn-line); background: var(--n0); border-radius: 0 8px 8px 0; white-space: pre-line; color: var(--n800) }
.qa-ny { display: grid; gap: 10px; padding-top: 14px; border-top: 1px solid var(--n200) }
.badge.ny { background: var(--red-600); color: var(--n0) }
.qa-varsel { color: var(--warn); font-weight: 600 }
.qa-filter { display: flex; gap: 6px; flex-wrap: wrap }
.qa-filter button { height: 34px; padding: 0 12px; font-size: 13px; color: var(--n700); border-color: var(--n300) }
.qa-filter button span { font-weight: 400; color: var(--n500) }
.qa-filter button.on { background: var(--red-600); border-color: var(--red-600); color: var(--n0) }
.qa-filter button.on span { color: var(--red-100) }

/* vedlegg */
.vl-gruppe { display: grid; gap: 8px }
.vl-gruppe h3 { font-size: 14px; margin: 0; color: var(--n700) }
.vl { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px }
.vl-rad { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--n200); border-radius: 14px; background: var(--n0) }
.vl-rad.fjernet { background: var(--n50); color: var(--n500) }
.vl-rad.fjernet .vl-navn { text-decoration: line-through; color: var(--n500) }
.vl-mini, .vl-ikon { width: 48px; height: 48px; border-radius: 10px; overflow: hidden; display: grid; place-items: center; background: var(--n100); color: var(--n600); font-size: 11px; font-weight: 700; letter-spacing: .04em }
.vl-mini img { width: 100%; height: 100%; object-fit: cover; display: block }
.vl-info { display: grid; gap: 2px; min-width: 0 }
.vl-navn { font-weight: 600; color: var(--n900); overflow-wrap: anywhere }
a.vl-navn { color: var(--red-700); text-decoration: none }
a.vl-navn:hover { text-decoration: underline; text-underline-offset: 3px }
.vl-rad select { width: auto; height: 34px; font-size: 13px; padding: 0 8px }
.vl-bilder { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px }
.vl-bilde { display: grid; gap: 4px; text-decoration: none; color: var(--n700); font-size: 12px; position: relative; min-width: 0; overflow-wrap: anywhere }
.vl-bilde img, .vl-bilde .vl-tom { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 12px; background: var(--n100); border: 1px solid var(--n200); display: grid; place-items: center; color: var(--n500); font-weight: 700 }
.vl-bilde .badge { position: absolute; top: 8px; left: 8px }
.slipp { border: 2px dashed var(--n300); border-radius: 16px; padding: 20px; display: grid; gap: 8px; justify-items: center; text-align: center; background: var(--n50) }
.slipp.over { border-color: var(--red-500); background: var(--red-50) }
.slipp p { margin: 0 }
label.filknapp { font-size: 14px; font-weight: 600; cursor: pointer; border-radius: 999px; height: 42px; padding: 0 18px; border: 1px solid var(--red-600);
  background: var(--red-600); color: var(--n0); display: inline-flex; align-items: center }
label.filknapp:hover { background: var(--red-700) }
label.filknapp:focus-within { box-shadow: 0 0 0 3px rgba(237,48,36,.25) }
.vl-last { color: var(--red-700); font-weight: 600; font-size: 13px; text-decoration: none; white-space: nowrap }
.vl-last:hover { text-decoration: underline; text-underline-offset: 3px }
.vl-fot { display: flex; gap: 8px 14px; align-items: center; flex-wrap: wrap }
.fakta .kal { justify-self: start; font-size: 13px; margin-top: 2px }
.sendt-sporsmal { display: grid; gap: 8px; padding-top: 14px; border-top: 1px solid var(--n200) }
.confirm.liten { padding: 10px 12px; gap: 8px; font-size: 13px; border-radius: 12px; max-width: 320px; white-space: normal }

/* e-post-forhåndsvisning */
.epost { border: 1px solid var(--n300); border-radius: 14px; overflow: hidden; background: var(--n0) }
.epost-rad { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--n200); font-size: 14px }
.epost-rad > span { color: var(--n500); font-size: 13px }
.epost-rad input { height: 38px }
.epost textarea { border: 0; border-radius: 0; padding: 14px; min-height: 340px; font-size: 14px; line-height: 1.55 }
.epost textarea:focus { box-shadow: inset 0 0 0 2px rgba(237,48,36,.25) }
.badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--ok-50); color: var(--ok); white-space: nowrap }
.badge.w { background: var(--warn-50); color: var(--warn) }

/* nøkkeltall */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px }
.kpi { border: 1px solid var(--n200); border-radius: 16px; padding: 16px 18px; display: grid; gap: 2px; background: var(--n0) }
.kpi b { font-size: 22px; font-weight: 700; color: var(--n900) }
.kpi span { font-size: 13px; color: var(--n500) }
.pos { color: var(--ok) !important } .neg { color: var(--red-700) !important }

/* startside: mørk Storebrand-hero med «lenken»-oval */
.hero { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; align-items: stretch }
.hero > .panel:first-child { background: var(--red-900); border: 0; color: var(--n0); position: relative; overflow: hidden; padding: 36px }
.hero > .panel:first-child::after { content: ""; position: absolute; width: 520px; height: 360px; border-radius: 50%; border: 48px solid var(--red-800);
  right: -260px; top: -170px; pointer-events: none }
.hero > .panel:first-child > * { position: relative; z-index: 1 }
.hero > .panel:first-child h1 { color: var(--n0); font-size: 36px }
.hero > .panel:first-child .muted { color: var(--on-dark-muted) }
.hero > .panel:first-child label.f { color: var(--on-dark-muted) }
.hero > .panel:first-child .codein { border-color: transparent }
.hero > .panel:first-child button.pri { background: var(--n0); color: var(--red-700); border-color: var(--n0); height: 50px; font-size: 16px }
.hero > .panel:first-child button.pri:hover { background: var(--red-50) }
.hero > .panel:first-child .box.info { background: rgba(255,255,255,.1); color: var(--n0) }
.hero > .panel:first-child .box.info button.link { color: var(--rosa-400) }
.hero > .panel:first-child .box.err { background: var(--red-50) }
.hero > .panel:last-child:not(:first-child) { background: var(--red-50); border-color: var(--red-100); align-content: start }
.hero.en { grid-template-columns: minmax(0, 1fr); max-width: 640px; width: 100%; margin: 0 auto }
.demo-fot { text-align: center }
.innlogging { max-width: 460px; width: 100%; margin: 0 auto }
.demo-bruker { height: auto; padding: 14px 18px; border-radius: 14px; justify-content: space-between; text-align: left; white-space: normal; color: var(--n800); gap: 12px }
.demo-bruker span { font-size: 13px; font-weight: 400; color: var(--n500) }
.bruker { font-size: 13px; color: var(--n600); margin-left: auto }
.bruker + nav { margin-left: 0 }
table.brukere input, table.brukere select { height: 38px; border-radius: 10px; min-width: 130px }
table.brukere td { vertical-align: middle }
table.brukere td:first-child { display: grid; gap: 4px; min-width: 200px }
table.brukere tr.venter td { background: var(--warn-50) }
.roller { display: grid; gap: 6px; font-size: 14px; color: var(--n600) }
.beslutning { display: grid; gap: 12px }

.confirm { border: 1px solid var(--warn-line); background: var(--warn-50); border-radius: 16px; padding: 16px 18px; display: grid; gap: 10px; color: var(--warn) }
.confirm strong { color: var(--n900) }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); background: var(--n900); color: var(--n0);
  padding: 12px 18px; border-radius: 12px; font-size: 14px; z-index: 20; max-width: calc(100% - 32px); box-shadow: var(--sh-lg) }
.receipt { background: var(--ok-50); border-color: var(--ok-line) }
.receipt h1 { color: var(--ok-ink) }
.receipt .tw { background: var(--n0) }
.stamp { font-size: 12px; font-weight: 700; color: var(--ok); border: 2px solid var(--ok); padding: 4px 12px; border-radius: 999px; background: var(--n0) }
.qr { background: var(--n0); padding: 10px; border-radius: 14px; border: 1px solid var(--n200); width: 200px; height: 200px }
.qr img { width: 100%; height: 100% }
.back { justify-self: start }

@media (max-width: 760px) {
  .hero { grid-template-columns: 1fr }
  .hero > .panel:first-child { padding: 24px 20px }
  .hero > .panel:first-child h1 { font-size: 28px }
  .bar nav:has(button + button) { margin-left: 0; width: 100%; order: 3 }
  .bar nav:has(button + button) button { flex: 1 }
}
@media (max-width: 600px) {
  table.inv thead { display: none }
  table.inv tr { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; padding: 12px 14px; border-bottom: 1px solid var(--n200) }
  table.inv tbody tr:last-child { border-bottom: 0 }
  table.inv td { border: 0; padding: 0 }
  table.inv td:nth-child(3), table.inv td:nth-child(4) { grid-column: 1 / -1 }
  table.inv td:nth-child(4) .row { justify-content: flex-start !important }
  table.inv .confirm.liten { max-width: none }
  .vl-rad { grid-template-columns: 40px minmax(0, 1fr) }

}
@media (max-width: 520px) {
  h1 { font-size: 25px }
  .panel { padding: 20px 16px; border-radius: 16px }
  .item { grid-template-columns: 1fr; padding: 14px 16px }
  .item .r { text-align: left }
  .logo img { height: 18px }
  .logo { gap: 10px } .logo span { padding-left: 10px; font-size: 14px }

  .bruker { margin-left: 0; width: 100%; order: 2 }
}
@media (prefers-reduced-motion: no-preference) {
  .toast { animation: up .24s cubic-bezier(.22,.61,.36,1) } @keyframes up { from { transform: translate(-50%, 8px); opacity: 0 } }
  .offer, .item, button { transition: background-color .12s, border-color .12s }
}
@media print {
  .bar, .noprint, .toast { display: none !important }
  body, .panel, .receipt { background: #fff; border: 0; box-shadow: none }
  main { padding: 0 }
}

<script>
/* =====================================================================
   OPPSETT – lim inn fra Supabase: Project Settings → API.
   Står de tomme, kjører siden som demo med eksempeldata.
   ===================================================================== */
const SUPABASE_URL = '';

  const w = [3, 2, 7, 6, 5, 4, 3, 2]; let s = 0;
  for (let i = 0; i < 8; i++) s += +p[i] * w[i];
  let k = 11 - (s % 11); if (k === 11) k = 0;

function supabaseApi(sb) {
  const ut = r => { if (r.error) throw new Error(r.error.message); return r.data; };
  return {
    demo: false,
    async sesjon() {
      const { data } = await sb.auth.getSession();
      if (!data.session) return null;
      const aal = ut(await sb.auth.mfa.getAuthenticatorAssuranceLevel());
      let profil = null;
      if (aal.currentLevel === 'aal2') { const r = await sb.from('profil').select('*').eq('id', data.session.user.id).maybeSingle(); profil = r.data; }
      return { epost: data.session.user.email, aal: aal.currentLevel, profil };
    },
    async loggInn(epost, passord) { ut(await sb.auth.signInWithPassword({ email: epost, password: passord })); },
    async loggUt() { await sb.auth.signOut(); },
    async mfaStatus() {
      const f = ut(await sb.auth.mfa.listFactors());
      const verifisert = (f.totp || []).find(x => x.status === 'verified');
      return { faktorId: verifisert?.id || null, uferdige: (f.all || []).filter(x => x.status !== 'verified').map(x => x.id) };
    },
    async mfaStart(uferdige) {
      for (const id of uferdige) await sb.auth.mfa.unenroll({ factorId: id });
      const d = ut(await sb.auth.mfa.enroll({ factorType: 'totp', friendlyName: 'Anbudsportal ' + Date.now() }));
      return { faktorId: d.id, qr: d.totp.qr_code, hemmelig: d.totp.secret };
    },
    async mfaBekreft(faktorId, kode) { ut(await sb.auth.mfa.challengeAndVerify({ factorId: faktorId, code: kode })); },
    async listAnbud() {

function fld(k, label, o = {}) {

  return `<label class="f${o.full || o.area ? ' full' : ''}">${lbl}${felt}${o.help ? `<span class="hint">${esc(o.help)}</span>` : ''}</label>`;

function sjekkUtkast(u, forUtsending) {
  const f = [];
  if (!trim(u.skadenr)) f.push('Skriv inn skadenummer.');
  if (!trim(u.adresse)) f.push('Skriv inn skadeadresse.');
  if (!u.frist || isNaN(new Date(u.frist))) f.push('Velg tilbudsfrist.');
  else if (forUtsending && new Date(u.frist) <= new Date()) f.push('Tilbudsfristen må være frem i tid.');
  if (forUtsending) {
    if (!trim(u.tittel)) f.push('Skriv hva som skal anskaffes (steg 1).');
    if (!trim(u.takst_navn)) f.push('Skriv inn takstmann (steg 2).');
    if (!epostOk(u.takst_epost)) f.push('Skriv inn en gyldig e-post for spørsmål (steg 2).');
    if (!u.vedstaelse) f.push('Velg vedståelsesfrist (steg 3).');
    if (!trim(u.beskrivelse)) f.push('Beskriv arbeidsomfanget (steg 4).');
    if (!trim(u.tildelingsregel)) f.push('Skriv tildelingsregel (steg 6).');
  }
  if (u.frist && u.vedstaelse && u.vedstaelse < dagFra(u.frist)) f.push('Vedståelsesfristen kan ikke være før tilbudsfristen.');
  if (u.frist && u.frist_sporsmal && u.frist_sporsmal > dagFra(u.frist)) f.push('Frist for spørsmål må være før tilbudsfristen.');
  if (u.frist && u.befaring && new Date(u.befaring) >= new Date(u.frist)) f.push('Befaringen må være før tilbudsfristen.');
  u.bygg.forEach((b, bi) => { if (!trim(b.navn)) f.push(`Bygg ${bi + 1} mangler navn.`);
    b.poster.forEach((p, pi) => { if (!trim(p.beskrivelse)) f.push(`Post ${postNr(bi, pi)} mangler beskrivelse.`);
      if (!(parseNum(p.mengde) > 0)) f.push(`Post ${postNr(bi, pi)} mangler mengde.`);
      if (forUtsending && !isNum(parseNum(u.kalkyle[p.id]))) f.push(`Post ${postNr(bi, pi)} mangler kalkyle.`); }); });
  return f;
}
function utkastForLagring(u) {
  const kalkyle = {}; u.bygg.forEach(b => b.poster.forEach(p => { const v = parseNum(u.kalkyle[p.id]); if (isNum(v)) kalkyle[p.id] = v; }));
  const ks = sumAnbud(u.bygg, kalkyle);
  const tekst = ['skadenr', 'adresse', 'tittel', 'beskrivelse', 'saerlige_forhold', 'takst_navn', 'takst_firma', 'takst_epost', 'takst_tlf', 'oppmote', 'onsket_ferdig', 'tildelingsregel'];
  return { ...u, ...Object.fromEntries(tekst.map(k => [k, trim(u[k])])), frist: new Date(u.frist).toISOString(),
    befaring: u.befaring ? new Date(u.befaring).toISOString() : null, frist_sporsmal: u.frist_sporsmal || null, vedstaelse: u.vedstaelse || null,
    bygg: u.bygg.map(b => ({ ...b, navn: trim(b.navn), poster: b.poster.map(p => ({ ...p, beskrivelse: trim(p.beskrivelse), mengde: String(p.mengde).trim() })) })),
    kalkyle, kalkyle_sum: ks.mangler ? null : ks.sum };

// Alle forbehold i et tilbud: [[byggnavn eller '', tekst], …]
const forbeholdListe = (a, t) => [

/* ---------- kalenderfil (.ics) for befaring og tilbudsfrist ---------- */
const icsTekst = v => String(v || '').replace(/\\/g, '\\\\').replace(/\r?\n/g, '\\n').replace(/([,;])/g, '\\$1');
const icsTid = d => new Date(d).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
// Kalenderlinjer kan være maks 75 bytes. Æ, ø og å tar 2 bytes, så vi teller bytes, ikke tegn.
const brett = l => { const enc = new TextEncoder(), ut = []; let linje = '', n = 0;
  for (const tegn of l) { const b = enc.encode(tegn).length; if (n + b > (ut.length ? 73 : 74)) { ut.push(linje); linje = ''; n = 0; } linje += tegn; n += b; }
  ut.push(linje); return ut.map((x, i) => (i ? ' ' : '') + x).join('\r\n'); };
function kalenderFil(a, type) {
  const bef = type === 'befaring';
  const start = bef ? new Date(a.befaring) : new Date(new Date(a.frist).getTime() - 30 * 6e4);
  const slutt = bef ? new Date(start.getTime() + 60 * 6e4) : new Date(a.frist);
  const kontakt = [a.takst_navn, a.takst_tlf, a.takst_epost].filter(trim).join(', ');
  const beskrivelse = bef
    ? `Befaring for anbud: ${a.tittel}\nSkadesak ${a.skadenr}${trim(a.oppmote) ? `\nOppmøte: ${a.oppmote}` : ''}\nKontakt: ${kontakt}`
    : `Frist for å levere tilbud i Storebrands anbudsportal.\n${a.tittel}\nSkadesak ${a.skadenr}\nSpørsmål: ${kontakt}`;
  const varsel = (tid, tekst) => ['BEGIN:VALARM', 'ACTION:DISPLAY', `TRIGGER:${tid}`, `DESCRIPTION:${icsTekst(tekst)}`, 'END:VALARM'];
  const linjer = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Storebrand//Anbudsportal//NO', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'BEGIN:VEVENT',
    `UID:${type}-${a.skadenr.replace(/[^A-Za-z0-9-]/g, '')}@anbudsportal`, `SEQUENCE:${Math.floor(Date.now() / 6e4)}`, `DTSTAMP:${icsTid(new Date())}`,
    `DTSTART:${icsTid(start)}`, `DTEND:${icsTid(slutt)}`,
    `SUMMARY:${icsTekst((bef ? 'Befaring: ' : 'Tilbudsfrist: ') + a.tittel)}`,
    `LOCATION:${icsTekst(bef ? a.adresse + (trim(a.oppmote) ? ` (${a.oppmote})` : '') : 'Storebrands anbudsportal')}`,
    `DESCRIPTION:${icsTekst(beskrivelse)}`,
    ...varsel('-P1D', bef ? 'Befaring i morgen' : 'Tilbudsfristen er i morgen'),
    ...(bef ? varsel('-PT1H', 'Befaring om en time') : []),
    'END:VEVENT', 'END:VCALENDAR'];
  return linjer.map(brett).join('\r\n') + '\r\n';
}
function lastNedKalender(type) {
  const a = ['lev', 'kvittering'].includes(S.view) ? S.lev.data.anbud : S.aktiv.anbud;
  const fil = new Blob([kalenderFil(a, type)], { type: 'text/calendar;charset=utf-8' });
  const lenke = document.createElement('a');
  lenke.href = URL.createObjectURL(fil); lenke.download = `${type}-${a.skadenr}.ics`;
  document.body.appendChild(lenke); lenke.click(); lenke.remove();
  setTimeout(() => URL.revokeObjectURL(lenke.href), 2000);
  toast('Kalenderfilen er lastet ned. Åpne den for å legge avtalen i kalenderen.');
}

    krav: `<div class="stack"><h3>Krav</h3><ul class="krav-liste">${FASTE_KRAV.map(k => `<li>${esc(k)}</li>`).join('')}</ul></div>

    `<button class="${aktiv === k ? 'on' : ''}" data-act="${act}" data-qf="${k}" aria-pressed="${aktiv === k}">${navn} <span>${antall}</span></button>`).join('')}</div>`;
}

/* ---------- spørsmål og svar (saksbehandler) ---------- */
function vQaAdmin(a, inv, sporsmal, avsluttet) {
  const navn = s => inv.find(v => v.id === s.invitasjon_id)?.leverandor || 'Leverandør som er trukket tilbake';
  const ubesvarte = sporsmal.filter(s => !s.publisert);
  const publiserte = sporsmal.filter(s => s.publisert).sort((x, y) => x.publisert.localeCompare(y.publisert));
  const u = S.qaUtkast;
  const grunn = a.status !== 'utsendt' ? 'Spørsmål og svar er stengt.' : new Date(a.frist) <= new Date() ? 'Tilbudsfristen har gått ut, så leverandørene kan ikke spørre mer.'
    : `Leverandørene kan stille spørsmål til og med ${a.frist_sporsmal ? datoDag(a.frist_sporsmal) : datoDag(a.frist) + ' (tilbudsfristen)'}.`;
  const f = S.qaFilter || 'alle';
  const sporsmalPub = publiserte.filter(s => s.sporsmal !== ''), avklaringer = publiserte.filter(s => s.sporsmal === '');
  const visVent = ['alle', 'venter', 'sporsmal'].includes(f);
  const visPub = f === 'alle' ? publiserte : f === 'sporsmal' ? sporsmalPub : f === 'avklaring' ? avklaringer : [];
  const vent = !visVent ? '' : ubesvarte.map(s => { const d = u[s.id] || { tekst: s.sporsmal, svar: '' };
    return `<div class="qa-item vent">
      <div class="qa-meta"><span class="badge w">Venter på svar</span><span>Fra <strong>${esc(navn(s))}</strong> · ${dato(s.opprettet)}</span></div>
      <blockquote>${esc(s.sporsmal)}</blockquote>
      ${avsluttet ? '' : `<label class="f">Spørsmålet slik alle ser det<textarea data-qt="${s.id}" rows="2">${esc(d.tekst)}</textarea>
        <span class="hint">Fjern navn og annet som viser hvem som spør.</span></label>
      <label class="f">Svar<textarea data-qs="${s.id}" rows="3" placeholder="Svaret publiseres til alle leverandørene">${esc(d.svar)}</textarea></label>
      ${S.bekreft === 'pub:' + s.id ? `<div class="confirm"><strong>Publisere svaret til alle leverandørene?</strong><p>Svaret kan ikke endres eller slettes etterpå.</p>
          <div class="row"><button class="pri" data-act="pub" data-id="${s.id}">Ja, publiser</button><button data-act="avbryt">Avbryt</button></div></div>`
        : S.bekreft === 'slettSp:' + s.id ? `<div class="confirm"><strong>Slette spørsmålet?</strong><p>Bruk dette bare for spørsmål som ikke skal besvares.</p>
          <div class="row"><button class="danger" data-act="slettSp" data-id="${s.id}">Ja, slett</button><button data-act="avbryt">Avbryt</button></div></div>`
        : `<div class="row"><button class="pri" data-act="spørPub" data-id="${s.id}">Publiser til alle</button><button class="ghost danger" data-act="spørSlettSp" data-id="${s.id}">Slett</button></div>`}`}
    </div>`; }).join('');
  const pub = visPub.map(s => `<div class="qa-item">
      <div class="qa-meta">${s.sporsmal === '' ? '<span class="badge">Avklaring</span>' : `<span>Fra <strong>${esc(navn(s))}</strong></span>`}<span>Publisert ${dato(s.publisert)}</span></div>
      ${s.sporsmal === '' ? '' : `<p class="qa-q">${esc(s.publisert_tekst)}</p>`}<p class="qa-a">${esc(s.svar)}</p></div>`).join('');
  return `<section class="panel" id="qa">
    <div class="row between"><div class="steg-h"><h2>Spørsmål og svar</h2><p class="sub">Svarene publiseres til alle leverandørene. Hvem som spurte, vises aldri for de andre.</p></div>
      ${ubesvarte.length ? `<span class="chip utkast">${ubesvarte.length} venter</span>` : ''}</div>
    <p class="small muted">${grunn}</p>
    ${sporsmal.length ? qaFilter(f, [['alle', 'Alle', sporsmal.length], ['venter', 'Venter på svar', ubesvarte.length],
      ['sporsmal', 'Spørsmål', ubesvarte.length + sporsmalPub.length], ['avklaring', 'Avklaringer', avklaringer.length]], 'qaFilter') : ''}
    ${vent}${pub}
    ${!ubesvarte.length && !publiserte.length ? '<p class="muted">Ingen spørsmål ennå.</p>'
      : !vent && !pub ? `<p class="muted">${{ venter: 'Ingen spørsmål venter på svar.', avklaring: 'Ingen avklaringer.', sporsmal: 'Ingen spørsmål.' }[f] || ''}</p>` : ''}
    ${avsluttet ? '' : `<div class="qa-ny">
      <label class="f"><span>Legg ut en avklaring til alle <em>(valgfritt)</em></span><textarea id="avklaring" rows="2" placeholder="F.eks. en rettelse eller noe alle bør vite">${esc(S.avklaring || '')}</textarea></label>
      ${S.bekreft === 'avklaring' ? `<div class="confirm"><strong>Publisere avklaringen til alle?</strong><p>Den kan ikke endres eller slettes etterpå.</p>
        <div class="row"><button class="pri" data-act="avklaring">Ja, publiser</button><button data-act="avbryt">Avbryt</button></div></div>`
      : `<button data-act="spørAvklaring" class="back">Publiser avklaring</button>`}</div>`}
  </section>`;
}

/* ---------- spørsmål og svar (leverandør) ---------- */
function vQaLev(L) {
  const d = L.data, forrige = d.forrige_besok ? new Date(d.forrige_besok) : null;
  const nytt = s => forrige && new Date(s.publisert) > forrige;
  const f = L.qaFilter || 'alle', qa = d.qa || [], mine = d.mine || [];
  const visQa = f === 'alle' ? qa : qa.filter(s => f === 'avklaring' ? s.avklaring : !s.avklaring);
  const visMine = f === 'avklaring' ? [] : mine;
  return `<section class="panel" id="qa">
    <div class="steg-h"><h2>Spørsmål og svar</h2><p class="sub">Spørsmål og svar deles med alle leverandørene. Navnet deres vises ikke.</p></div>
    ${qa.length + mine.length ? qaFilter(f, [['alle', 'Alle', qa.length + mine.length], ['sporsmal', 'Spørsmål', qa.filter(s => !s.avklaring).length + mine.length],
      ['avklaring', 'Avklaringer', qa.filter(s => s.avklaring).length]], 'qaFilterLev') : ''}
    ${visQa.map(s => `<div class="qa-item">
      <div class="qa-meta">${s.avklaring ? '<span class="badge">Avklaring</span>' : ''}${nytt(s) ? '<span class="badge ny">Nytt</span>' : ''}<span>${dato(s.publisert)}</span></div>
      ${s.avklaring ? '' : `<p class="qa-q">${esc(s.sporsmal)}</p>`}<p class="qa-a">${esc(s.svar)}</p></div>`).join('')}
    ${visMine.map(s => `<div class="qa-item vent"><div class="qa-meta"><span class="badge w">Venter på svar</span><span>Sendt ${dato(s.opprettet)}</span></div><p class="qa-q">${esc(s.sporsmal)}</p></div>`).join('')}
    ${!qa.length && !mine.length ? '<p class="muted">Ingen spørsmål ennå.</p>' : !visQa.length && !visMine.length ? `<p class="muted">${f === 'avklaring' ? 'Ingen avklaringer.' : 'Ingen spørsmål.'}</p>` : ''}
    ${d.sporsmal_stengt ? `<p class="small muted">${esc(d.sporsmal_stengt)}</p>` : `<div class="qa-ny">
      <label class="f">Still et spørsmål<textarea data-lq="1" rows="3" maxlength="2000" placeholder="Spør om det dere trenger for å gi riktig pris.">${esc(L.sporsmal || '')}</textarea>
        <span class="hint">${d.anbud.frist_sporsmal ? `Frist for spørsmål: ${datoDag(d.anbud.frist_sporsmal)}.` : ''} Svaret publiseres her.</span></label>
      <button data-act="levSporsmal" class="back">Send spørsmål</button></div>`}
  </section>`;
}

/* ---------- invitasjon på e-post (sendes fra saksbehandlers eget e-postprogram) ---------- */
const KODE = '[KODE]';
const portalAdresse = () => !api.demo && /^https?:$/.test(location.protocol) ? location.origin + location.pathname : 'https://din-adresse.no';
const epostEmne = a => `Forespørsel om tilbud: ${a.tittel} (skadesak ${a.skadenr})`;
function epostTekst(a, navn, nyKode) {
  const linjer = [`Hei${trim(navn) ? ' ' + trim(navn) : ''},`, '',
    ...(nyKode ? ['Her er en ny kode til anbudet. Den gamle koden virker ikke lenger. Tilbud og spørsmål dere allerede har sendt, er tatt vare på.', ''] : []),
    `Storebrand ber om tilbud på: ${a.tittel}`, `Skadesak ${a.skadenr}, ${a.adresse}.`, '',
    'Slik gir dere pris:', `1. Gå til ${portalAdresse()}`, `2. Skriv inn koden: ${KODE}`, '',
    `Eller åpne denne lenken, så er koden fylt inn: ${portalAdresse()}#kode=${KODE}`, ''];
  if (a.befaring) linjer.push(`Befaring: ${dato(a.befaring)}${trim(a.oppmote) ? ', ' + trim(a.oppmote) : ''}`);
  if (a.frist_sporsmal) linjer.push(`Frist for spørsmål: ${datoDag(a.frist_sporsmal)}. Spørsmål stilles i portalen.`);
  linjer.push(`Tilbudsfrist: ${dato(a.frist)}`, '', 'Koden er personlig. Ikke del den med andre.', '',
    'Med vennlig hilsen', a.takst_navn, ...[a.takst_firma, a.takst_tlf].filter(trim));
  return linjer.join('\n');
}
function aapneEpost(til, emne, tekst) {
  const lenke = document.createElement('a');
  lenke.href = `mailto:${encodeURIComponent(til || '')}?subject=${encodeURIComponent(emne)}&body=${encodeURIComponent(tekst.replace(/\r?\n/g, '\r\n'))}`;
  document.body.appendChild(lenke); lenke.click(); lenke.remove();
}
function vInviter(a) {
  const u = S.invUtkast, nk = S.nyKode;
  if (nk) return `<section class="panel" id="inviter"><div class="steg-h"><span class="step">${nk.fornyet ? 'Ny kode' : 'Steg 3 av 3'}</span><h2>${nk.epost ? 'Send e-posten' : 'Send koden'}</h2>
      ${nk.fornyet ? `<p class="sub">Den gamle koden til ${esc(nk.navn)} virker ikke lenger. Det de har levert, er tatt vare på.</p>` : ''}</div>
      <div class="box warn small"><strong>Koden for ${esc(nk.navn)} vises bare nå.</strong> Den lagres ikke i klartekst, så du kan ikke hente den frem igjen.</div>
      <div class="code">${esc(nk.kode)}</div>
      <p>${nk.epost ? `En ferdig utfylt e-post til <strong>${esc(nk.epost)}</strong> skal nå ha åpnet seg i e-postprogrammet ditt. Se over og trykk send der.`
        : 'Leverandøren har ingen e-post registrert. Kopier teksten og send den selv.'}</p>
      <div class="row">${nk.epost ? '<button class="pri" data-act="aapneIgjen">Åpne e-posten</button>' : ''}<button data-act="kopierTekst">Kopier teksten</button><button class="ghost" data-act="kopierKode">Kopier bare koden</button>
        ${api.demo ? `<button class="ghost" data-act="provSom" data-kode="${esc(nk.kode)}">Demo: se siden som leverandøren →</button>` : ''}</div>
      ${nk.epost ? '<p class="hint">Åpnet den seg ikke? Trykk «Åpne e-posten» igjen. Virker det fortsatt ikke, trykk «Kopier teksten» og lim den inn i en ny e-post.</p>' : ''}
      <div class="sendt-sporsmal"><strong>Har du sendt den?</strong>
        <div class="row"><button data-act="merkSendt" data-id="${nk.id}">Ja, marker som sendt</button><button class="ghost" data-act="lukkKode">Ikke ennå</button></div></div>
    </section>`;
  if (u) return `<section class="panel" id="inviter"><div class="steg-h"><span class="step">Steg 2 av 3</span><h2>Se over e-posten</h2>
        <p class="sub">Ingenting sendes fra portalen. Du sender selv fra ditt eget e-postprogram.</p></div>
      <div class="epost">
        <div class="epost-rad"><span>Fra</span><div>Din egen e-postadresse <span class="muted small">(åpnes i e-postprogrammet ditt, for eksempel Outlook)</span></div></div>
        <div class="epost-rad"><span>Til</span><div>${u.epost ? `<strong>${esc(u.epost)}</strong>` : '<span class="muted">Ingen e-post. Du kopierer teksten og sender selv.</span>'}</div></div>
        <label class="epost-rad"><span>Emne</span><input id="invEmne" value="${esc(u.emne)}"></label>
        <textarea id="invTekst" rows="18" aria-label="Tekst i e-posten">${esc(u.tekst)}</textarea>
      </div>
      <p class="hint">${KODE} byttes ut med leverandørens personlige kode når du trykker på knappen. Send én e-post per leverandør, aldri flere på samme e-post.</p>
      <div class="row"><button class="pri" data-act="lagOgSend">${u.epost ? 'Lag kode og åpne e-post' : 'Lag kode'}</button><button data-act="invTilbake">Tilbake</button></div>
    </section>`;
  return `<section class="panel" id="inviter"><div class="steg-h"><span class="step">Steg 1 av 3</span><h2>Inviter leverandør</h2>
      <p class="sub">Du ser e-posten før noe sendes. Den sendes fra din egen e-post, ikke fra portalen.</p></div>
    <form class="grid2" data-form="inviter">
      <label class="f">Firmanavn<input id="invnavn" placeholder="Firma AS" required></label>
      <label class="f"><span>E-post <em>(valgfritt)</em></span><input id="invepost" type="email" placeholder="post@firma.no"></label>
      <div class="row" style="align-self:end"><button class="pri" type="submit">Se e-posten</button></div>
    </form>
  </section>`;
}

/* ---------- anbefaling (takstmann) og tildeling (admin) ---------- */
const valgtNaa = () => S.valgt ?? S.aktiv?.anbud?.anbefalt_invitasjon ?? null;
function vBeslutning(a, sortert, valgtT, trengerBegr) {
  const anbefalt = sortert.find(x => x.invitasjon_id === a.anbefalt_invitasjon);
  const begr = (tekst) => trengerBegr ? `<label class="f">${tekst}<textarea id="begr" placeholder="For eksempel: kortere byggetid, færre forbehold, bedre referanser">${esc(S.begrunnelse)}</textarea></label>` : '';
  if (erAdmin()) return `<div class="beslutning">
    ${anbefalt ? `<div class="box info">Takstmannen anbefaler <strong>${esc(anbefalt.firmanavn)}</strong> (${kr(anbefalt.sum_eks_mva)}).${trim(a.anbefalt_begrunnelse) ? `<br><span class="small">Begrunnelse: ${esc(a.anbefalt_begrunnelse)}</span>` : ''}</div>`
      : '<p class="small muted">Takstmannen har ikke sendt anbefaling ennå. Du kan likevel tildele.</p>'}
    ${begr('Begrunnelse – du har ikke valgt laveste tilbud')}
    ${S.bekreft === 'tildel' ? `<div class="confirm"><strong>Tildele oppdraget til ${esc(valgtT?.firmanavn)}?</strong><p>Saken lukkes. Ingen kan sende eller endre tilbud etterpå.</p>
      <div class="row"><button class="pri" data-act="tildel">Ja, tildel</button><button data-act="avbryt">Avbryt</button></div></div>`
    : `<div class="row"><button class="pri" data-act="spørTildel" ${valgtT ? '' : 'disabled'}>Tildel valgt tilbud</button>${!valgtT ? '<span class="small muted">Velg et tilbud over.</span>' : ''}</div>`}
  </div>`;
  return `<div class="beslutning">
    ${anbefalt ? `<div class="box info">Du har anbefalt <strong>${esc(anbefalt.firmanavn)}</strong>. Storebrand tildeler oppdraget. Du kan endre anbefalingen frem til det er tildelt.</div>`
      : '<p class="small muted">Velg tilbudet du anbefaler. Storebrand tar den endelige beslutningen.</p>'}
    ${begr('Begrunnelse – du anbefaler ikke laveste tilbud')}
    ${S.bekreft === 'anbefal' ? `<div class="confirm"><strong>Anbefale ${esc(valgtT?.firmanavn)}?</strong><p>Storebrand ser anbefalingen i portalen og tildeler oppdraget.</p>
      <div class="row"><button class="pri" data-act="anbefal">Ja, send anbefaling</button><button data-act="avbryt">Avbryt</button></div></div>`
    : `<div class="row"><button class="pri" data-act="spørAnbefal" ${valgtT ? '' : 'disabled'}>${anbefalt ? 'Oppdater anbefaling' : 'Send anbefaling til Storebrand'}</button>${!valgtT ? '<span class="small muted">Velg et tilbud over.</span>' : ''}</div>`}
  </div>`;
}

/* ---------- brukere (bare admin) ---------- */
function vBrukere() {

    return `<tr class="${b.rolle === 'venter' ? 'venter' : ''}"><td><input data-bu="${b.id}" data-bf="navn" value="${esc(u.navn)}" placeholder="Navn" aria-label="Navn"><span class="small muted">${esc(b.epost)}</span></td>
      <td><input data-bu="${b.id}" data-bf="firma" value="${esc(u.firma)}" placeholder="Firma" aria-label="Firma"></td>
      <td><select data-bu="${b.id}" data-bf="rolle" aria-label="Rolle">${Object.entries(ROLLER).map(([k, v]) => `<option value="${k}" ${u.rolle === k ? 'selected' : ''}>${v}</option>`).join('')}</select></td>
      <td>${u.rolle === 'takstmann' ? `<select data-bu="${b.id}" data-bf="type" aria-label="Intern eller ekstern"><option value="">Velg</option>
        <option value="intern" ${u.type === 'intern' ? 'selected' : ''}>Intern</option><option value="ekstern" ${u.type === 'ekstern' ? 'selected' : ''}>Ekstern</option></select>` : '<span class="muted small">–</span>'}</td>
      <td>${S.brukerUtkast[b.id] ? `<button class="pri small" data-act="lagreBruker" data-id="${b.id}">Lagre</button>` : ''}</td></tr>`; }).join('');
  const venter = (S.brukere || []).filter(b => b.rolle === 'venter').length;

    ${feilBoks()}
    <section class="panel">

/* ---------- vedlegg (Storebrand og takstmann) ---------- */
function vVedlegg(a, liste) {
  const aktive = liste.filter(v => !v.fjernet), fjernede = liste.filter(v => v.fjernet);
  const kanLeggeTil = ['utkast', 'utsendt'].includes(a.status);
  const ikon = v => v.url && visbartBilde(v.mime)
    ? `<a class="vl-mini" href="${esc(v.url)}" target="_blank" rel="noopener" aria-label="Åpne ${esc(v.navn)}"><img src="${esc(v.url)}" alt="" loading="lazy"></a>`
    : `<span class="vl-ikon" aria-hidden="true">${filMerke(v.mime)}</span>`;
  const rad = v => `<li class="vl-rad${v.fjernet ? ' fjernet' : ''}" data-vid="${v.id}">${ikon(v)}
      <div class="vl-info">${v.url ? `<a class="vl-navn" href="${esc(v.url)}" target="_blank" rel="noopener">${esc(v.navn)}</a>` : `<span class="vl-navn">${esc(v.navn)}</span>`}
        <span class="small muted">${storrelseTekst(v.storrelse)} · ${dato(v.opprettet)}${v.fjernet ? ` · fjernet ${dato(v.fjernet)}` : ''}</span>
        ${v.etter_utsending && !v.fjernet ? '<span><span class="badge ny">Lagt til etter utsending</span></span>' : ''}</div>
      ${v.fjernet ? '' : `<select data-vk="${v.id}" aria-label="Kategori for ${esc(v.navn)}">${Object.entries(KATEGORIER).map(([k, n]) => `<option value="${k}" ${k === v.kategori ? 'selected' : ''}>${n}</option>`).join('')}</select>
        <div class="vl-handling">${S.bekreft === 'fjernV:' + v.id ? `<div class="confirm liten"><span>Fjerne ${esc(v.navn)}? ${a.status === 'utkast' ? 'Filen slettes.' : 'Filen slettes, og leverandørene ser den ikke lenger.'}</span>
          <div class="row"><button class="danger small" data-act="fjernV" data-id="${v.id}">Ja, fjern</button><button class="small" data-act="avbryt">Avbryt</button></div></div>`
          : `<button class="ghost danger small" data-act="spørFjernV" data-id="${v.id}">Fjern</button>`}</div>`}</li>`;
  const grupper = Object.entries(KATEGORIER).map(([k, n]) => { const g = aktive.filter(v => v.kategori === k);
    return g.length ? `<div class="vl-gruppe"><h3>${n} <span class="muted">(${g.length})</span></h3><ul class="vl">${g.map(rad).join('')}</ul></div>` : ''; }).join('');
  return `${S.vedleggFeil?.length ? `<div class="box err" role="alert"><strong>${S.vedleggFeil.length === 1 ? 'En fil ble ikke lastet opp' : 'Noen filer ble ikke lastet opp'}</strong><ul>${S.vedleggFeil.map(f => `<li>${esc(f)}</li>`).join('')}</ul></div>` : ''}
    ${aktive.length ? grupper : '<p class="muted">Ingen vedlegg ennå.</p>'}
    ${kanLeggeTil ? (S.lasterOpp ? `<div class="slipp" aria-live="polite"><p><strong>Laster opp ${S.lasterOpp.nr} av ${S.lasterOpp.av} …</strong></p><span class="hint">${esc(S.lasterOpp.navn)}</span></div>`
      : aktive.length >= MAKS_VEDLEGG ? `<div class="box info small">Anbudet har ${MAKS_VEDLEGG} vedlegg, som er maks. Fjern ett for å legge til flere.</div>`
      : `<div class="box warn small"><strong>Personvern:</strong> Ikke last opp bilder der personer kan kjennes igjen, og fjern kundens navn og telefon fra rapporter før du laster dem opp. Leverandørene ser alt som ligger her.</div>
        <div class="slipp" id="slipp"><p><strong>Dra filer hit</strong>, eller</p>
          <label class="filknapp">Velg filer<input type="file" id="vedleggFil" multiple accept="${FIL_AKSEPT}" hidden></label>
          <span class="hint">PDF, bilder (JPG, PNG, HEIC), Word og Excel. Maks 20 MB per fil og ${MAKS_VEDLEGG} vedlegg per anbud.</span></div>
        ${a.status === 'utsendt' ? '<p class="hint">Nye vedlegg merkes som nye hos leverandørene. Gi dem gjerne beskjed, særlig hvis noen allerede har levert.</p>' : ''}`)
      : ''}
    ${fjernede.length ? `<details><summary class="small muted">Fjernet (${fjernede.length})</summary><ul class="vl" style="margin-top:8px">${fjernede.map(rad).join('')}</ul></details>` : ''}`;
}

function vAnbud() {
  const { anbud: a, invitasjoner: inv, tilbud: t } = S.aktiv;
  const sortert = [...t].sort((x, y) => x.sum_eks_mva - y.sum_eks_mva);
  const laveste = sortert[0]?.sum_eks_mva;
  const avsluttet = ['tildelt', 'avlyst'].includes(a.status);
  const tildelt = sortert.find(x => x.invitasjon_id === a.tildelt_invitasjon);
  const valgt = valgtNaa();
  const valgtT = sortert.find(x => x.invitasjon_id === valgt);
  const trengerBegr = valgtT && valgtT.sum_eks_mva > laveste;
  const avvik = s => a.kalkyle_sum ? ((s - a.kalkyle_sum) / a.kalkyle_sum * 100) : null;
  const pct = v => v == null ? '' : `<span class="${v > 0 ? 'neg' : 'pos'}">${v > 0 ? '+' : ''}${nf.format(Math.round(v * 10) / 10)} %</span>`;

  const kort = sortert.map((x, i) => { const navn = inv.find(v => v.id === x.invitasjon_id)?.leverandor || x.firmanavn;
    return `<label class="offer ${valgt === x.invitasjon_id || (avsluttet && x.invitasjon_id === a.tildelt_invitasjon) ? 'sel' : ''}">
      ${avsluttet ? `<span class="pnr">${i + 1}.</span>` : `<input type="radio" name="valg" data-act="velg" data-id="${x.invitasjon_id}" ${valgt === x.invitasjon_id ? 'checked' : ''}>`}
      <span><strong>${esc(x.firmanavn)}</strong> ${i === 0 ? '<span class="badge">Lavest</span>' : ''} ${forbeholdListe(a, x).length ? '<span class="badge w">Forbehold</span>' : ''} ${x.invitasjon_id === a.tildelt_invitasjon ? '<span class="badge">Tildelt</span>' : ''} ${!avsluttet && x.invitasjon_id === a.anbefalt_invitasjon ? '<span class="badge ny">Anbefalt</span>' : ''}</span>
      <span class="s">${kr(x.sum_eks_mva)}<br><span class="small">${pct(avvik(x.sum_eks_mva))}</span></span>
      <span class="meta gj"><span>Byggetid <b>${uker(tall(x.byggetid_uker))}</b></span><span>Oppstart <b>${datoDag(x.oppstart)}</b></span><span>Timepris <b>${kr(tall(x.timepris))}</b></span></span>
      <span class="meta"><span>Org.nr <span class="mono">${esc(x.orgnr)}</span></span><span>${esc(x.kontakt)}</span><span>Levert ${dato(x.levert)}${x.antall_innsendinger > 1 ? ` (endret ${x.antall_innsendinger - 1} g.)` : ''}</span>${navn !== x.firmanavn ? `<span>Invitert som ${esc(navn)}</span>` : ''}</span>
      ${forbeholdListe(a, x).map(([hvor, tekst]) => `<span class="meta fb">Forbehold${hvor ? ' – ' + esc(hvor) : ''}: ${esc(tekst)}</span>`).join('')}
    </label>`; }).join('');

  const kol = sortert;
  const tabell = `<div class="tw"><table><thead><tr><th>Nr</th><th>Post</th><th class="n">Mengde</th><th class="n">Kalkyle</th>${kol.map(x => `<th class="n">${esc(x.firmanavn.replace(/ AS$/, ''))}</th>`).join('')}</tr></thead><tbody>
    ${a.bygg.map((b, bi) => `<tr><td colspan="${4 + kol.length}"><strong>${esc(b.navn)}</strong></td></tr>` + b.poster.map((p, pi) => {
      const m = parseNum(p.mengde); const linjer = kol.map(x => parseNum(x.priser[p.id]) * m); const min = Math.min(...linjer);
      return `<tr><td class="pnr">${postNr(bi, pi)}</td><td>${esc(p.beskrivelse)} <span class="muted small">· ${esc(p.fag)}</span></td><td class="n">${esc(p.mengde)} ${esc(p.enhet)}</td>
        <td class="n">${kr(parseNum(a.kalkyle?.[p.id]) * m)}</td>${linjer.map(l => `<td class="n ${kol.length > 1 && l === min ? 'lo' : ''}">${kr(l)}</td>`).join('')}</tr>`; }).join('')).join('')}
    <tr class="sum"><td></td><td>Sum eks. mva</td><td></td><td class="n">${kr(a.kalkyle_sum)}</td>${kol.map(x => `<td class="n">${kr(x.sum_eks_mva)}</td>`).join('')}</tr>
    <tr class="gj"><td></td><td>Byggetid</td><td></td><td></td>${kol.map(x => `<td class="n">${uker(tall(x.byggetid_uker))}</td>`).join('')}</tr>
    <tr class="gj"><td></td><td>Oppstart</td><td></td><td></td>${kol.map(x => `<td class="n">${datoDag(x.oppstart)}</td>`).join('')}</tr>
    <tr class="gj"><td></td><td>Timepris tilleggsarbeid</td><td></td><td></td>${kol.map(x => `<td class="n">${kr(tall(x.timepris))}</td>`).join('')}</tr>
    </tbody></table></div>`;

  const invRader = inv.map(v => { const lev = t.find(x => x.invitasjon_id === v.id);
    return `<tr><td>${esc(v.leverandor)}<br>${v.epost ? `<span class="small muted">${esc(v.epost)}</span>` : '<span class="small qa-varsel">Ingen e-post</span>'}</td><td class="mono small">••••-${esc(v.kode_slutt)}</td>
      <td class="small">${lev ? `<span class="pos">Levert</span>` : v.sist_aapnet ? `Åpnet ${dato(v.sist_aapnet)}` : v.sendt ? `Sendt ${dato(v.sendt)}` : '<span class="qa-varsel">Ikke sendt</span>'}
        ${v.kode_fornyet ? `<br><span class="muted">Ny kode ${dato(v.kode_fornyet)}${!v.sendt ? ' · <span class="qa-varsel">ikke sendt</span>' : ''}</span>` : ''}</td>
      <td><div class="row" style="gap:4px;justify-content:flex-end">${!avsluttet && !lev && !v.sendt && !v.sist_aapnet ? `<button class="small" data-act="merkSendt" data-id="${v.id}">Marker som sendt</button>` : ''}
        ${!avsluttet && S.bekreft === 'nyKode:' + v.id ? `<div class="confirm liten"><span>Lage ny kode til ${esc(v.leverandor)}? Den gamle slutter å virke med en gang. Det de har levert, blir liggende.</span>
          <label class="f">Send til e-post<input id="nyKodeEpost" type="email" value="${esc(v.epost || '')}" placeholder="post@firma.no"></label>
          <div class="row"><button class="pri small" data-act="nyKode" data-id="${v.id}">Ja, lag ny kode og åpne e-post</button><button class="small" data-act="avbryt">Avbryt</button></div>
          <span class="hint">Uten e-post får du teksten til å kopiere i stedet.</span></div>`
        : !avsluttet && !S.bekreft?.endsWith(':' + v.id) ? `<button class="ghost small" data-act="spørNyKode" data-id="${v.id}">Lag ny kode</button>` : ''}
        ${!avsluttet && !lev && S.bekreft !== 'nyKode:' + v.id ? (S.bekreft === 'slettInv:' + v.id ? `<div class="confirm liten"><span>Trekke tilbake invitasjonen? Koden slutter å virke med en gang.</span>
          <div class="row"><button class="danger small" data-act="slettInv" data-id="${v.id}">Ja, trekk tilbake</button><button class="small" data-act="avbryt">Avbryt</button></div></div>`
          : `<button class="ghost danger small" data-act="spørSlettInv" data-id="${v.id}">Trekk tilbake invitasjon</button>`) : ''}</div></td></tr>`; }).join('');


  return `<button class="link back" data-act="liste">← Alle anbud</button>
    <div class="row between"><div class="stack" style="gap:4px"><h1 class="mono" style="font-family:var(--f-mono);font-size:1.5rem">${esc(a.skadenr)}</h1>
      <span class="muted">${esc(a.adresse)} · ${esc(a.skadetype)}</span></div><span class="chip ${a.status}">${a.status}</span></div>
    ${feilBoks()}
    <section class="kpis">
      <div class="kpi"><span>Din kalkyle</span><b>${kr(a.kalkyle_sum)}</b></div>
      <div class="kpi"><span>Tilbud levert</span><b>${t.length} av ${inv.length}</b></div>
      <div class="kpi"><span>Laveste tilbud</span><b>${kr(laveste)}</b>${laveste != null ? `<span>${pct(avvik(laveste))} mot kalkyle</span>` : ''}</div>
      <div class="kpi"><span>${a.status === 'utsendt' ? 'Frist' : 'Fristen var'}</span><b style="font-size:1rem">${dato(a.frist)}</b><span>${a.status === 'utsendt' ? igjen(a.frist) : ''}</span></div>
    </section>
    <details class="panel vis-anbud"><summary><h2>Anbudet</h2><span class="sub">Slik leverandørene ser det</span></summary>
      <h3 class="tittel">${esc(a.tittel)}</h3>${anbudDeler(a).fakta}${anbudDeler(a).arbeid}${anbudDeler(a).krav}</details>
    <section class="panel" id="vedlegg"><div class="steg-h"><h2>Vedlegg</h2><p class="sub">Takstrapport, bilder og andre dokumenter. Leverandørene ser disse.</p></div>
      ${vVedlegg(a, S.aktiv.vedlegg || [])}</section>
    ${vQaAdmin(a, inv, S.aktiv.sporsmal || [], avsluttet)}
    ${a.status === 'tildelt' && tildelt ? `<div class="box info">Tildelt <strong>${esc(tildelt.firmanavn)}</strong> for ${kr(tildelt.sum_eks_mva)} eks. mva.${erAdmin() ? ` Besparelse mot kalkyle: <strong class="num">${kr(a.kalkyle_sum - tildelt.sum_eks_mva)}</strong>.` : ''}${trim(a.tildelt_begrunnelse) ? `<br><span class="small">Begrunnelse: ${esc(a.tildelt_begrunnelse)}</span>` : ''}</div>` : ''}

    ${!avsluttet ? vInviter(a) : ''}

    <section class="panel"><h2>Invitasjoner</h2>
      ${inv.length ? `<div class="tw"><table class="inv"><thead><tr><th>Leverandør</th><th>Kode</th><th>Status</th><th></th></tr></thead><tbody>${invRader}</tbody></table></div>` : '<p class="muted">Ingen invitert ennå.</p>'}
    </section>

    <section class="panel"><h2>Tilbud</h2>
      ${t.length ? `<div class="cards">${kort}</div>
        ${!avsluttet ? vBeslutning(a, sortert, valgtT, trengerBegr) : ''}
        <h3 style="margin-top:8px">Pris per post</h3>${tabell}`
      : '<p class="muted">Ingen tilbud levert ennå.</p>'}
    </section>

    ${!avsluttet ? `<section class="panel"><div class="steg-h"><h2>Frister og befaring</h2><p class="sub">Dette kan endres etter utsending. Gi beskjed til leverandørene når du endrer noe.</p></div>
      <form class="stack" data-form="frist"><div class="grid2">
        <label class="f">Tilbudsfrist<input id="nyfrist" type="datetime-local" value="${esc(tilLokal(a.frist))}"></label>
        <label class="f"><span>Frist for spørsmål <em>(valgfritt)</em></span><input id="nysporsmal" type="date" value="${esc(a.frist_sporsmal || '')}"></label>
        <label class="f"><span>Befaring <em>(valgfritt)</em></span><input id="nybefaring" type="datetime-local" value="${esc(a.befaring ? tilLokal(a.befaring) : '')}"></label>
        <label class="f"><span>Oppmøtested <em>(valgfritt)</em></span><input id="nyoppmote" value="${esc(a.oppmote || '')}"></label>
      </div><button type="submit" class="back">Lagre endringer</button></form>
      ${S.bekreft === 'avlys' ? `<div class="confirm"><strong>Avlyse anbudet?</strong><p>Leverandørene får beskjed om at anbudet er avlyst når de åpner koden.</p><div class="row"><button class="danger" data-act="avlys">Ja, avlys</button><button data-act="avbryt">Avbryt</button></div></div>`
        : `<button class="ghost danger back" data-act="spørAvlys">Avlys anbudet</button>`}
    </section>` : ''}`;
}

/* ---------- årsoversikt ---------- */
function vAar() {
  const rader = S.aar || [];
  const aarListe = [...new Set(rader.map(r => r.aar))].sort((a, b) => b - a);
  const valgtAar = S.valgtAar ?? aarListe[0];
  const r = rader.filter(x => x.aar === valgtAar);
  const tild = r.filter(x => x.status === 'tildelt' && x.tildelt_sum != null);
  const sum = k => tild.reduce((s, x) => s + (Number(x[k]) || 0), 0);
  const bk = sum('besparelse_mot_kalkyle'), bs = sum('besparelse_mot_snitt'), ts = sum('tildelt_sum'), ks = sum('kalkyle_sum');
  const tsv = ['Skadenr\tSkadetype\tStatus\tKalkyle\tAntall tilbud\tLaveste\tSnitt\tTildelt\tBesparelse mot kalkyle\tBesparelse mot snitt',
    ...r.map(x => [x.skadenr, x.skadetype, x.status, x.kalkyle_sum, x.antall_tilbud, x.laveste, x.snitt == null ? '' : Math.round(x.snitt), x.tildelt_sum, x.besparelse_mot_kalkyle, x.besparelse_mot_snitt == null ? '' : Math.round(x.besparelse_mot_snitt)].map(v => v == null ? '' : String(v).replace('.', ',')).join('\t'))].join('\n');
  S._tsv = tsv;
  return `<div class="row between"><h1>Årsoversikt</h1>
    ${aarListe.length > 1 ? `<select id="aarvalg" style="width:auto">${aarListe.map(y => `<option ${y === valgtAar ? 'selected' : ''}>${y}</option>`).join('')}</select>` : `<span class="mono">${valgtAar ?? ''}</span>`}</div>
    ${feilBoks()}
    <section class="kpis">
      <div class="kpi"><span>Tildelte anbud</span><b>${tild.length}</b><span>av ${r.length} totalt</span></div>
      <div class="kpi"><span>Tildelt for</span><b>${kr(ts)}</b><span>Kalkyle: ${kr(ks)}</span></div>
      <div class="kpi"><span>Besparelse mot kalkyle</span><b class="${bk >= 0 ? 'pos' : 'neg'}">${kr(bk)}</b><span>${ks ? nf.format(Math.round(bk / ks * 1000) / 10) + ' %' : ''}</span></div>
      <div class="kpi"><span>Besparelse mot snitt av tilbud</span><b class="${bs >= 0 ? 'pos' : 'neg'}">${kr(bs)}</b><span>Hva konkurransen ga</span></div>
    </section>
    <div class="box info small">«Mot kalkyle» viser hvor mye under din egen pris dere havnet. «Mot snitt» viser hva det betyr å hente flere tilbud i stedet for å ta et tilfeldig ett. Det siste er ofte det ærligste tallet å vise ledelsen.</div>
    <section class="panel"><div class="row between"><h2>Alle anbud ${valgtAar ?? ''}</h2><button data-act="kopierTsv">Kopier til Excel</button></div>
      <div class="tw"><table><thead><tr><th>Skadenr</th><th>Status</th><th class="n">Kalkyle</th><th class="n">Tilbud</th><th class="n">Laveste</th><th class="n">Tildelt</th><th class="n">Spart mot kalkyle</th><th class="n">Spart mot snitt</th></tr></thead><tbody>
      ${r.map(x => `<tr><td><button class="link mono" data-act="aapne" data-id="${x.id}">${esc(x.skadenr)}</button><br><span class="small muted">${esc(x.skadetype)}</span></td>
        <td><span class="chip ${x.status}">${x.status}</span></td><td class="n">${kr(tall(x.kalkyle_sum))}</td><td class="n">${x.antall_tilbud}</td>
        <td class="n">${kr(tall(x.laveste))}</td><td class="n">${kr(tall(x.tildelt_sum))}</td>
        <td class="n">${x.besparelse_mot_kalkyle == null ? '–' : `<span class="${x.besparelse_mot_kalkyle >= 0 ? 'pos' : 'neg'}">${kr(tall(x.besparelse_mot_kalkyle))}</span>`}</td>
        <td class="n">${kr(tall(x.besparelse_mot_snitt))}</td></tr>`).join('') || '<tr><td colspan="8" class="muted">Ingen anbud dette året.</td></tr>'}
      </tbody></table></div></section>`;
}

/* ---------- leverandør ---------- */
// Vedlegg er nye for leverandøren når de kom etter utsending og etter forrige besøk
const vedleggNytt = (v, L) => v.etter_utsending && L.data.forrige_besok && new Date(v.opprettet) > new Date(L.data.forrige_besok);
function vVedleggLev(L) {
  const liste = L.data.vedlegg || [];
  if (!liste.length) return '';
  const url = id => L.lenker?.[id] || null;
  const ny = v => vedleggNytt(v, L) ? '<span class="badge ny">Nytt</span>' : '';
  const grupper = Object.entries(KATEGORIER).map(([k, n]) => { const g = liste.filter(v => v.kategori === k); if (!g.length) return '';
    const bilder = g.filter(v => visbartBilde(v.mime)), andre = g.filter(v => !visbartBilde(v.mime));
    return `<div class="vl-gruppe"><h3>${n}</h3>
      ${bilder.length ? `<div class="vl-bilder">${bilder.map(v => url(v.id)
        ? `<a class="vl-bilde" href="${esc(url(v.id))}" target="_blank" rel="noopener">${ny(v)}<img src="${esc(url(v.id))}" alt="${esc(v.navn)}" loading="lazy"><span>${esc(v.navn)}</span></a>`
        : `<span class="vl-bilde">${ny(v)}<span class="vl-tom">BILDE</span><span>${esc(v.navn)}</span></span>`).join('')}</div>` : ''}
      ${andre.length ? `<ul class="vl">${andre.map(v => `<li class="vl-rad"><span class="vl-ikon" aria-hidden="true">${filMerke(v.mime)}</span>
        <div class="vl-info">${url(v.id) ? `<a class="vl-navn" href="${esc(url(v.id))}" target="_blank" rel="noopener">${esc(v.navn)}</a>` : `<span class="vl-navn">${esc(v.navn)}</span>`}
          <span class="small muted">${storrelseTekst(v.storrelse)}</span></div>
        <span>${ny(v)}</span>${url(v.id) ? `<a class="vl-last" href="${esc(url(v.id))}" target="_blank" rel="noopener" download="${esc(v.navn)}">Last ned</a>` : '<span></span>'}</li>`).join('')}</ul>` : ''}</div>`; }).join('');
  return `<section class="panel" id="levVedlegg"><div class="steg-h"><h2>Vedlegg</h2><p class="sub">Takstrapport, bilder og andre dokumenter fra takstmannen.</p></div>
    ${L.lenkeFeil ? `<div class="box warn">${esc(L.lenkeFeil)}</div>` : ''}
    ${grupper}
    <div class="vl-fot"><span class="hint">${L.lenker ? 'Av sikkerhetshensyn virker lenkene i én time.' : L.lenkeFeil ? '' : 'Henter lenker …'}</span>
      ${L.lenker || L.lenkeFeil ? '<button class="ghost small" data-act="levLenker">Hent lenker på nytt</button>' : ''}</div></section>`;
}
async function hentLevLenker() {
  const L = S.lev; if (!L?.data.vedlegg?.length) return;
  L.lenkeFeil = null;
  try { L.lenker = await api.levVedleggLenker(L.kode); } catch (e) { L.lenker = null; L.lenkeFeil = e.message || 'Fikk ikke hentet vedleggene.'; }
  // Bytt bare ut vedleggsdelen, så leverandøren ikke mister det de holder på å skrive
  const el = document.getElementById('levVedlegg');
  if (S.lev === L && el) el.outerHTML = vVedleggLev(L);
}
function vLev() {
  const L = S.lev, a = L.data.anbud, f = L.form;
  const s = sumAnbud(a.bygg, f.priser);
  const orgOk = !f.orgnr || orgnrGyldig(f.orgnr.replace(/\s/g, ''));
  const laast = !L.data.aapen;
  const ro = laast ? 'readonly' : '';
  const poster = a.bygg.map((b, bi) => `<div class="bygg"><div class="bygg-h"><span class="pnr">${bi + 1}</span><h3>${esc(b.navn)}</h3></div>
    ${b.poster.map((p, pi) => { const e = parseNum(f.priser[p.id]), m = parseNum(p.mengde);
      return `<div class="lev-post"><div><span class="pnr">${postNr(bi, pi)}</span> ${esc(p.beskrivelse)}<div class="q">${esc(p.fag)} · ${esc(p.mengde)} ${esc(p.enhet)}</div></div>
        <div class="pin"><input data-lp="${p.id}" value="${esc(f.priser[p.id] ?? '')}" inputmode="decimal" placeholder="0" aria-label="Pris per ${esc(p.enhet)} for post ${postNr(bi, pi)}" ${ro}><span class="small muted">kr/${esc(p.enhet)}</span></div>
        <div class="ls num" id="lls-${p.id}">${isNum(e) && isNum(m) ? kr(e * m) : ''}</div></div>`; }).join('')}
    <label class="f lev-fb"><span>Forbehold for ${esc(b.navn)} <em>(valgfritt)</em></span><textarea data-lfb="${b.id}" rows="2" ${ro} placeholder="Bare forbehold som gjelder dette bygget.">${esc(f.forbehold_bygg[b.id] || '')}</textarea></label>
    </div>`).join('');
  const d = anbudDeler(a);
  const forrige = L.data.forrige_besok ? new Date(L.data.forrige_besok) : null;
  const nyeSvar = (L.data.qa || []).filter(s => forrige && new Date(s.publisert) > forrige).length;
  const svarEtterLevert = L.data.tilbud && (L.data.qa || []).some(s => new Date(s.publisert) > new Date(L.data.tilbud.levert));
  const nyeVedlegg = (L.data.vedlegg || []).filter(v => vedleggNytt(v, L)).length;
  const vedleggEtterLevert = L.data.tilbud && (L.data.vedlegg || []).some(v => v.etter_utsending && new Date(v.opprettet) > new Date(L.data.tilbud.levert));
  const og = x => x.filter(Boolean).join(' og ');
  return `${(svarEtterLevert || vedleggEtterLevert) && !laast
      ? `<div class="box warn"><strong>Det er ${og([svarEtterLevert && 'publisert svar', vedleggEtterLevert && 'lagt til vedlegg'])} etter at dere leverte.</strong> Sjekk ${og([svarEtterLevert && '«Spørsmål og svar»', vedleggEtterLevert && '«Vedlegg»'])} om tilbudet må endres.</div>`

async function aapneAnbud(id) {
  const d = await api.hentAnbud(id);

async function levAapne(kode) {
  const r = await api.levHent(kode);

  const t = r.tilbud;

  S.lev = { kode, data: r, form: { firmanavn: t?.firmanavn || '', orgnr: t?.orgnr || '', kontakt: t?.kontakt || '', telefon: t?.telefon || '', epost: t?.epost || '', forbehold: t?.forbehold || '',

}
