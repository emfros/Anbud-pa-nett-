async function lagreUtkast(sendUt) {
  const f = sjekkUtkast(S.utkast, sendUt);
  if (f.length) { S.feil = f; S.bekreft = null; return keep(); }
  await jobb(async () => {
    const lagret = await api.lagreAnbud(utkastForLagring(S.utkast));
    if (sendUt) { await api.settStatus(lagret.id, 'utsendt'); toast('Anbudet er sendt ut. Nå kan du invitere leverandører.'); await aapneAnbud(lagret.id); }
    else { S.utkast.id = lagret.id; toast('Utkastet er lagret'); keep(); }
  });
}
// Vedleggene hører til utkastet når vi redigerer, ellers til anbudet som er åpent
const vedleggSted = () => S.view === 'rediger' ? { anbud: S.utkast, liste: S.utkastVedlegg || [] } : { anbud: S.aktiv.anbud, liste: S.aktiv.vedlegg || [] };
async function lastVedleggPaaNytt(anbudId) {
  const v = await api.listVedlegg(anbudId);
  if (S.view === 'rediger' && S.utkast?.id === anbudId) S.utkastVedlegg = v;
  else if (S.aktiv?.anbud.id === anbudId) S.aktiv.vedlegg = v;
}
async function lastOppFiler(filer) {
  const { anbud, liste } = vedleggSted(); if (!anbud?.id || S.lasterOpp) return;
  const feil = [], ok = [];
  let plass = MAKS_VEDLEGG - liste.filter(v => !v.fjernet).length;
  const klare = [];
  for (const f of filer) {
    const mime = filType(f);
    if (!mime) feil.push(`${f.name}: filtypen er ikke tillatt. Bruk PDF, bilder, Word eller Excel.`);
    else if (f.size > MAKS_FIL) feil.push(`${f.name}: filen er større enn 20 MB.`);
    else if (!f.size) feil.push(`${f.name}: filen er tom.`);
    else if (plass <= 0) feil.push(`${f.name}: anbudet har allerede ${MAKS_VEDLEGG} vedlegg, som er maks.`);
    else { klare.push([f, mime]); plass--; }
  }
  for (const [n, [f, mime]] of klare.entries()) {
    S.lasterOpp = { nr: n + 1, av: klare.length, navn: f.name }; keep();
    try { await api.lastOppVedlegg(anbud.id, f, gjettKategori(f.name, mime), mime); ok.push(f.name); }
    catch (e) { feil.push(`${f.name}: ${e.message || e}`); }
  }
  S.lasterOpp = null;
  try { await lastVedleggPaaNytt(anbud.id); } catch (e) { feil.push(e.message || String(e)); }
  S.vedleggFeil = feil;
  if (ok.length) toast(ok.length === 1 ? 'Vedlegget er lastet opp' : `${ok.length} vedlegg er lastet opp`);
  keep();
}
async function levSend() {
  const f = S.lev.form, a = S.lev.data.anbud, feil = [];
  if (!trim(f.firmanavn)) feil.push('Skriv inn firmanavn.');
  if (!orgnrGyldig(f.orgnr.replace(/\s/g, ''))) feil.push('Skriv inn et gyldig organisasjonsnummer (9 siffer).');
  if (!trim(f.kontakt)) feil.push('Skriv inn kontaktperson.');
  if (!(parseNum(f.byggetid_uker) > 0)) feil.push('Oppgi byggetid i uker.');
  if (!f.oppstart) feil.push('Oppgi tidligste oppstart.');
  if (!(parseNum(f.timepris) >= 0)) feil.push('Oppgi timepris for tilleggsarbeid.');
  a.bygg.forEach((b, bi) => b.poster.forEach((p, pi) => { const v = parseNum(f.priser[p.id]); if (!isNum(v) || v < 0) feil.push(`Post ${postNr(bi, pi)} mangler pris.`); }));
  if (!f.bekreftet) feil.push('Kryss av for at tilbudet følger kravene.');
  if (feil.length) { S.feil = feil; return keep(); }
  await jobb(async () => {
    const priser = Object.fromEntries(Object.entries(f.priser).map(([k, v]) => [k, parseNum(v)]));
    const r = await api.levSend(S.lev.kode, { ...f, orgnr: f.orgnr.replace(/\s/g, ''), priser,
      byggetid_uker: parseNum(f.byggetid_uker), timepris: parseNum(f.timepris), bekreftet: f.bekreftet === true });
    if (!r.ok) { S.feil = [r.feil]; return keep(); }
    S.lev.kvittering = r; S.lev.form.priser = Object.fromEntries(Object.entries(priser).map(([k, v]) => [k, v]));
    S.view = 'kvittering'; render();
  });
}

// Skjemaene håndteres her. Vi lytter også på klikk og Enter selv, fordi noen innebygde
// forhåndsvisninger (for eksempel i Claude) blokkerer vanlig innsending av skjema.
document.addEventListener('submit', e => { e.preventDefault(); haandterSkjema(e.target); });
document.addEventListener('click', e => {
  const knapp = e.target.closest('button[type="submit"]');
  if (knapp?.form?.dataset.form) { e.preventDefault(); haandterSkjema(knapp.form); }
}, true);
document.addEventListener('keydown', e => {
  const t = e.target;
  if (e.key !== 'Enter' || e.isComposing || t.tagName !== 'INPUT' || !t.form?.dataset.form) return;
  e.preventDefault(); haandterSkjema(t.form);
});
function haandterSkjema(skjema) {
  if (!skjema.reportValidity()) return;
  const f = skjema.dataset.form;
  if (f === 'kode') { const k = $('#kode').value; if (!trim(k)) { S.feil = ['Skriv inn koden.']; return render(); } jobb(() => levAapne(k)); }
  if (f === 'login') jobb(async () => { await api.loggInn($('#epost').value, $('#passord').value); await tilAdmin(); });
  if (f === 'mfa') jobb(async () => { await api.mfaBekreft(S.mfa.faktorId, $('#mfakode').value.trim()); S.mfa = null; await tilAdmin(); });
  if (f === 'inviter') { const navn = trim($('#invnavn').value), ep = trim($('#invepost').value);
    if (!navn) { S.feil = ['Skriv inn navnet på leverandøren.']; return keep(); }
    if (ep && !epostOk(ep)) { S.feil = ['E-postadressen ser ikke riktig ut.']; return keep(); }
    S.feil = []; S.invUtkast = { navn, epost: ep, emne: epostEmne(S.aktiv.anbud), tekst: epostTekst(S.aktiv.anbud, '') }; keep(); }
  if (f === 'frist') jobb(async () => {
    const v = $('#nyfrist').value; if (!v) throw new Error('Velg tilbudsfrist.');
    const b = $('#nybefaring').value, sp = $('#nysporsmal').value;
    const felt = { frist: new Date(v).toISOString(), frist_sporsmal: sp || null, befaring: b ? new Date(b).toISOString() : null, oppmote: trim($('#nyoppmote').value) };
    if (sp && sp > dagFra(felt.frist)) throw new Error('Frist for spørsmål må være før tilbudsfristen.');
    if (b && new Date(b) >= new Date(felt.frist)) throw new Error('Befaringen må være før tilbudsfristen.');
    await api.oppdaterFrister(S.aktiv.anbud.id, felt); S.aktiv = await api.hentAnbud(S.aktiv.anbud.id); toast('Endringene er lagret'); keep(); });
}

document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'begr') { S.begrunnelse = t.value; return; }
  if (t.id === 'avklaring') { S.avklaring = t.value; return; }
  if (t.dataset.bu) { const b = S.brukere.find(x => x.id === t.dataset.bu); const u = S.brukerUtkast[b.id] ||= { ...b }; u[t.dataset.bf] = t.value;
    if (t.tagName === 'SELECT') keep(); else if (!document.querySelector(`[data-act="lagreBruker"][data-id="${b.id}"]`)) { const p = t.selectionStart; keep(); const el = document.querySelector(`[data-bu="${b.id}"][data-bf="${t.dataset.bf}"]`); el?.focus(); el?.setSelectionRange?.(p, p); } return; }
  if (t.id === 'invEmne') { S.invUtkast.emne = t.value; return; }
  if (t.id === 'invTekst') { S.invUtkast.tekst = t.value; return; }
  if (t.dataset.qt || t.dataset.qs) { const id = t.dataset.qt || t.dataset.qs; const s = S.aktiv.sporsmal.find(x => x.id === id);
    const d = S.qaUtkast[id] ||= { tekst: s.sporsmal, svar: '' }; if (t.dataset.qt) d.tekst = t.value; else d.svar = t.value; return; }
  if (t.dataset.lq) { S.lev.sporsmal = t.value; return; }
  if (t.id === 'aarvalg') return;
  const u = S.utkast;
  if (t.dataset.f) { u[t.dataset.f] = t.type === 'datetime-local' ? (t.value ? new Date(t.value).toISOString() : '') : t.value; return; }
  if (t.dataset.lfb) { S.lev.form.forbehold_bygg[t.dataset.lfb] = t.value; return; }
  if (t.dataset.lf === 'bekreftet') { S.lev.form.bekreftet = t.checked;
    const før = S.feil.length; S.feil = S.feil.filter(x => !x.startsWith('Kryss av')); if (S.feil.length !== før) keep(); return; }
  if (t.dataset.bf) { u.bygg[+t.dataset.b][t.dataset.bf] = t.value; return; }
  if (t.dataset.p || t.dataset.k) {
    if (t.dataset.p) { const [bi, pi] = t.dataset.p.split(',').map(Number); u.bygg[bi].poster[pi][t.dataset.pf] = t.value; }
    else u.kalkyle[t.dataset.k] = t.value;
    u.bygg.forEach(b => b.poster.forEach(p => { const el = document.getElementById('ls-' + p.id); const e2 = parseNum(u.kalkyle[p.id]), m = parseNum(p.mengde); if (el) el.textContent = isNum(e2) && isNum(m) ? kr(e2 * m) : '–'; }));
    const ks = sumAnbud(u.bygg, u.kalkyle); $('#kalk-sum').textContent = kr(ks.sum); $('#kalk-mangler').textContent = ks.mangler ? `(${ks.mangler} post uten kalkyle)` : '';
    return;
  }
  if (t.dataset.lf || t.dataset.lp) {
    const f = S.lev.form;
    if (t.dataset.lf) f[t.dataset.lf] = t.value; else f.priser[t.dataset.lp] = t.value;
    if (t.dataset.lf === 'orgnr') { const ok = !t.value || orgnrGyldig(t.value.replace(/\s/g, '')); const ferdig = t.value.replace(/\s/g, '').length >= 9;
      t.classList.toggle('bad', !ok && ferdig); $('#orgfeil').textContent = !ok && ferdig ? 'Sjekk nummeret – det er ikke et gyldig org.nr.' : ''; }
    if (t.dataset.lp) { const a = S.lev.data.anbud; const p = a.bygg.flatMap(b => b.poster).find(x => x.id === t.dataset.lp);
      const e2 = parseNum(t.value), m = parseNum(p.mengde); $('#lls-' + p.id).textContent = isNum(e2) && isNum(m) ? kr(e2 * m) : '';
      const s = sumAnbud(a.bygg, f.priser); $('#lsum').textContent = kr(s.sum); $('#lsum2').textContent = kr(s.sum); $('#lmva').textContent = 'Inkl. mva: ' + kr(s.sum * (1 + MVA));
      $('#lmangler').textContent = s.mangler ? `${s.mangler} post(er) mangler pris` : ''; }
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'aarvalg') { S.valgtAar = +t.value; render(); }
  if (t.id === 'vedleggFil') { const filer = [...t.files]; t.value = ''; if (filer.length) lastOppFiler(filer); }
  if (t.dataset.vk) jobb(async () => { const { anbud } = vedleggSted();
    await api.endreVedlegg(t.dataset.vk, { kategori: t.value }); S.vedleggFeil = []; await lastVedleggPaaNytt(anbud.id); toast('Kategorien er endret'); keep(); });
});
// Dra og slipp filer. Filer som slippes utenfor feltet, skal ikke åpnes i nettleseren (da mister man det man holder på med).
const harFiler = e => [...(e.dataTransfer?.types || [])].includes('Files');
document.addEventListener('dragover', e => { if (!harFiler(e)) return; e.preventDefault(); const z = e.target.closest?.('#slipp');
  e.dataTransfer.dropEffect = z ? 'copy' : 'none'; z?.classList.add('over'); });
document.addEventListener('dragleave', e => { const z = e.target.closest?.('#slipp'); if (z && !z.contains(e.relatedTarget)) z.classList.remove('over'); });
document.addEventListener('drop', e => { if (!harFiler(e)) return; e.preventDefault(); const z = e.target.closest?.('#slipp');
  if (z) { z.classList.remove('over'); lastOppFiler([...e.dataTransfer.files]); } });

/* =====================================================================
   Oppstart
   ===================================================================== */
async function start() {
  if (SUPABASE_URL && SUPABASE_ANON_KEY) {
    await new Promise((ok, feil) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js'; s.onload = ok; s.onerror = () => feil(new Error('Fikk ikke lastet Supabase.')); document.head.appendChild(s); });
    api = supabaseApi(window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY));
  } else api = demoApi();

  // Kode i lenken (#kode=...) fylles inn, og fjernes fra adresselinjen med en gang.
  const m = location.hash.match(/kode=([A-Za-z0-9-]+)/);
  if (m) { S._kodeFyll = m[1]; history.replaceState(null, '', location.pathname + location.search); }

  // Forsiden er for leverandører. Storebrand og takstmenn bruker adressen med #intern.
  const rute = async () => {
    S.feil = [];
    if (location.hash === '#intern') { try { await tilAdmin(); } catch (e) { S.feil = [e.message]; S.view = 'login'; render(); } }
    else if (!['lev', 'kvittering'].includes(S.view)) { S.view = 'start'; render(); }
  };
  window.addEventListener('hashchange', rute);
  S.sesjon = await api.sesjon().catch(() => null);
  await rute();
}
start().catch(e => { document.getElementById('app').innerHTML = `<div class="box err">${esc(e.message)}</div>`; });
</script>
